services:
  nginx:
    image: jaweewo/nginx-modsecurity:main
    container_name: nginx-modsecurity
    restart: unless-stopped
    ports:
      - "80:80"
      # Uncomment after configuring an HTTPS server and certificates.
      # - "443:443"
    volumes:
      - ./conf.d:/etc/nginx/conf.d:ro
      - ./ssl:/etc/nginx/ssl:ro
